<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Todo List App</title>

<!-- buat impor css nya -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="desain.css" rel="stylesheet" >
</head>

<!-- kopas isian body Movie BD ganti tambahin beberapa -->
<body class="bg-light">

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-8 col-md-10">

                <div class="text-center mb-4">
                    <h1 class="fw-bold text-primary">To do List App</h1>
                    <p class="text-secondary">
                        Catat dan selesaikan tugasmu.
                    </p>
                </div>

                <div class="card border-0 shadow-sm mb-4">
                    <div class="card-body p-4">

                        <form id="todo-form">
                            <label for="todo-input" class="form-label fw-semibold">
                                Tugas hari ini
                            </label>

                            <div class="input-group">
                                <input
                                    type="text"
                                    class="form-control"
                                    id="todo-input"
                                    placeholder="..."
                                    maxlength="50"
                                    autocomplete="off"
                                >
                                <button class="btn btn-primary" type="submit">
                                    Tambah
                                </button>
                            </div>

                            <div id="form-message" class="small mt-2" role="status" aria-live="polite"></div>
                        </form>

                    </div>
                </div>

                <div class="row g-3 mb-4">
                    <div class="col-6">
                        <div class="card border-0 shadow-sm h-100">
                            <div class="card-body text-center">
                                <p class="text-secondary mb-1">Total Tugas</p>
                                <h2 id="total-count" class="text-primary fw-bold mb-0">0</h2>
                            </div>
                        </div>
                    </div>

                    <div class="col-6">
                        <div class="card border-0 shadow-sm h-100">
                            <div class="card-body text-center">
                                <p class="text-secondary mb-1">Tugas Selesai</p>
                                <h2 id="completed-count" class="text-success fw-bold mb-0">0</h2>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="card border-0 shadow-sm">
                    <div class="card-body p-4">

                        <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3">
                            <h2 class="h5 fw-bold mb-0">Daftar Tugas</h2>

                            <button
                                type="button"
                                id="clear-all"
                                class="btn btn-outline-danger btn-sm"
                                disabled
                            >
                                Hapus Semua
                            </button>
                        </div>

                        <div class="btn-group w-100 mb-4" role="group" aria-label="Filter tugas">
                            <button type="button" class="btn btn-primary filter-btn" data-filter="all" aria-pressed="true">
                                Semua
                            </button>
                            <button type="button" class="btn btn-outline-primary filter-btn" data-filter="active" aria-pressed="false">
                                Aktif
                            </button>
                            <button type="button" class="btn btn-outline-primary filter-btn" data-filter="completed" aria-pressed="false">
                                Selesai
                            </button>
                        </div>

                        <ul id="todo-list" class="list-group list-group-flush"></ul>

                        <div id="empty-message" class="text-center py-4 text-secondary">
                            Belum ada tugas
                        </div>

                    </div>
                </div>

                <p class="text-center text-secondary small mt-4">
                    Todo List App | JS, HTML, CSS, Bootstrap
                </p>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
